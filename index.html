<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Dillon Harindiran: Building something new in the legal space. Former CEO & Co-Founder of Slipstream." />
    <meta name="author" content="Dillon Harindiran" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="color-scheme" content="light dark" />
    <title>Dillon Harindiran</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.png" type="image/png" />
</head>
<body>
    <!-- Fixed background: counsel-style (ripple grid + dot grid + gray swirls + grain) -->
    <div class="bg-canvas" aria-hidden="true">
        <div class="bg-ripple-wrap" id="bgRippleWrap">
            <div class="bg-ripple-grid" id="bgRippleGrid"></div>
        </div>
        <div class="bg-dot-grid"></div>
        <div class="bg-swirls">
            <div class="bg-swirl bg-swirl-1"></div>
            <div class="bg-swirl bg-swirl-2"></div>
            <div class="bg-swirl bg-swirl-3"></div>
            <div class="bg-swirl bg-swirl-4"></div>
            <div class="bg-swirl bg-swirl-5"></div>
        </div>
        <div class="bg-grain"></div>
    </div>

    <!-- Main content -->
    <main class="main-content">
        <section class="tile glass-e2">
            <div id="textDisplay" class="copy copy-block"></div>
        </section>
    </main>

    <script>
        // ----- Background ripple grid (same behaviour as counsel site) -----
        (function () {
            var CELL_SIZE = 40;
            var activeRipples = [];
            var hoveredCell = null;
            var nextId = 0;
            var timeouts = [];
            var gridEl = null;
            var wrapEl = null;
            var rows = 0;
            var cols = 0;
            var rafId = null;
            var mouseLeaveBound = false;
            var lastScale = [];
            var lastOpacity = [];
            var lastHovered = [];

            function rippleDurationMs(row, col, rowsCount, colsCount) {
                function toCorner(r, c) {
                    return Math.hypot(row - r, col - c);
                }
                var maxDist = Math.max(
                    toCorner(0, 0),
                    toCorner(0, colsCount - 1),
                    toCorner(rowsCount - 1, 0),
                    toCorner(rowsCount - 1, colsCount - 1)
                );
                return maxDist * 55 + (200 + maxDist * 80);
            }

            function rippleIntensity(phase) {
                if (phase <= 0 || phase >= 1) return { scale: 1, opacity: 0.4 };
                var scale = 1 + 0.15 * 4 * phase * (1 - phase);
                var opacity = phase <= 0.5
                    ? 0.4 + 0.5 * 2 * phase
                    : 0.9 - 0.5 * 2 * (phase - 0.5);
                return { scale: scale, opacity: opacity };
            }

            function triggerRipple(row, col) {
                if (document.documentElement.classList.contains('reduce-motion')) return;
                var id = nextId++;
                var startTime = performance.now();
                activeRipples.push({ id: id, row: row, col: col, startTime: startTime });
                var duration = rippleDurationMs(row, col, rows, cols);
                timeouts.push(setTimeout(function () {
                    activeRipples = activeRipples.filter(function (r) { return r.id !== id; });
                }, duration));
            }

            function clearHoverFromCell(r, c) {
                if (!gridEl || r < 0 || c < 0 || r >= rows || c >= cols) return;
                var idx = r * cols + c;
                var el = gridEl.children[idx];
                if (el) {
                    el.style.opacity = '0.4';
                    el.style.boxShadow = '';
                }
            }

            function applyHoverToCell(r, c) {
                if (!gridEl || r < 0 || c < 0 || r >= rows || c >= cols) return;
                var idx = r * cols + c;
                var el = gridEl.children[idx];
                if (el) {
                    el.style.opacity = '0.9';
                    el.style.boxShadow = 'inset 0 0 0 1px rgba(255,255,255,0.2)';
                }
            }

            function resetCells() {
                if (!gridEl) return;
                var children = gridEl.children;
                var n = children.length;
                for (var i = 0; i < n; i++) {
                    var el = children[i];
                    el.style.transform = 'scale(1)';
                    el.style.opacity = '0.4';
                    el.style.boxShadow = '';
                    el.style.backgroundColor = '';
                    el.style.borderColor = '';
                    lastScale[i] = 1;
                    lastOpacity[i] = 0.4;
                    lastHovered[i] = false;
                }
            }

            function loop(now) {
                if (!gridEl) return;
                var children = gridEl.children;
                var n = children.length;
                var isHoveredIdx = hoveredCell ? hoveredCell.row * cols + hoveredCell.col : -1;
                for (var idx = 0; idx < n; idx++) {
                    var rowIdx = (idx / cols) | 0;
                    var colIdx = idx % cols;
                    var scale = 1;
                    var opacity = 0.4;
                    for (var i = 0; i < activeRipples.length; i++) {
                        var r = activeRipples[i];
                        var dist = Math.hypot(r.row - rowIdx, r.col - colIdx);
                        var delay = dist * 55;
                        var duration = 200 + dist * 80;
                        var elapsed = now - r.startTime;
                        var phase = 0;
                        if (elapsed >= delay && elapsed < delay + duration) {
                            phase = (elapsed - delay) / duration;
                        }
                        var out = rippleIntensity(phase);
                        if (out.scale > scale) scale = out.scale;
                        if (out.opacity > opacity) opacity = out.opacity;
                    }
                    var hovered = idx === isHoveredIdx;
                    if (hovered) opacity = opacity > 0.9 ? opacity : 0.9;
                    if (lastScale[idx] === scale && lastOpacity[idx] === opacity && lastHovered[idx] === hovered) continue;
                    lastScale[idx] = scale;
                    lastOpacity[idx] = opacity;
                    lastHovered[idx] = hovered;
                    var el = children[idx];
                    el.style.transform = 'scale(' + scale + ')';
                    el.style.opacity = String(opacity);
                    el.style.boxShadow = hovered ? 'inset 0 0 0 1px rgba(255,255,255,0.2)' : '';
                    if (opacity > 0.4) {
                        var whiteAlpha = (0.12 + (opacity - 0.4) * 0.5) * 0.8;
                        el.style.backgroundColor = 'rgba(255,255,255,' + Math.min(whiteAlpha, 0.36) + ')';
                        el.style.borderColor = 'rgba(255,255,255,0.28)';
                    } else {
                        el.style.backgroundColor = '';
                        el.style.borderColor = '';
                    }
                }
                if (activeRipples.length === 0 && !hoveredCell) {
                    resetCells();
                    return;
                }
                rafId = requestAnimationFrame(loop);
            }

            function startLoop() {
                if (rafId != null) return;
                rafId = requestAnimationFrame(function tick(now) {
                    rafId = null;
                    loop(now);
                    if (activeRipples.length > 0 || hoveredCell) {
                        rafId = requestAnimationFrame(tick);
                    }
                });
            }

            function buildGrid() {
                wrapEl = document.getElementById('bgRippleWrap');
                gridEl = document.getElementById('bgRippleGrid');
                if (!wrapEl || !gridEl) return;
                rows = Math.ceil(window.innerHeight / CELL_SIZE);
                cols = Math.ceil(window.innerWidth / CELL_SIZE);
                var total = rows * cols;
                lastScale.length = 0;
                lastOpacity.length = 0;
                lastHovered.length = 0;
                lastScale.length = total;
                lastOpacity.length = total;
                lastHovered.length = total;
                gridEl.style.gridTemplateColumns = 'repeat(' + cols + ', ' + CELL_SIZE + 'px)';
                gridEl.style.gridTemplateRows = 'repeat(' + rows + ', ' + CELL_SIZE + 'px)';
                gridEl.style.width = (cols * CELL_SIZE) + 'px';
                gridEl.style.height = (rows * CELL_SIZE) + 'px';
                gridEl.innerHTML = '';
                activeRipples = [];
                hoveredCell = null;
                timeouts.forEach(clearTimeout);
                timeouts = [];
                for (var r = 0; r < rows; r++) {
                    for (var c = 0; c < cols; c++) {
                        var cell = document.createElement('div');
                        cell.className = 'bg-ripple-cell';
                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        cell.addEventListener('click', function () {
                            var row = parseInt(this.dataset.row, 10);
                            var col = parseInt(this.dataset.col, 10);
                            triggerRipple(row, col);
                            startLoop();
                        });
                        cell.addEventListener('mouseenter', function () {
                            var row = parseInt(this.dataset.row, 10);
                            var col = parseInt(this.dataset.col, 10);
                            if (hoveredCell && (hoveredCell.row !== row || hoveredCell.col !== col)) {
                                clearHoverFromCell(hoveredCell.row, hoveredCell.col);
                            }
                            hoveredCell = { row: row, col: col };
                            applyHoverToCell(row, col);
                            startLoop();
                        });
                        gridEl.appendChild(cell);
                    }
                }
                if (!mouseLeaveBound && wrapEl) {
                    mouseLeaveBound = true;
                    wrapEl.addEventListener('mouseleave', function () {
                        if (hoveredCell) {
                            clearHoverFromCell(hoveredCell.row, hoveredCell.col);
                            hoveredCell = null;
                        }
                    });
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', buildGrid);
            } else {
                buildGrid();
            }
            window.addEventListener('resize', buildGrid);
        })();

        // Fetch and display the original text content; first "Counsel" becomes a pill link
        fetch('index.txt')
            .then((response) => response.text())
            .then((text) => {
                const container = document.getElementById('textDisplay');
                function escapeHtml(s) {
                    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                }
                var escaped = escapeHtml(text);
                var withPill = escaped
                    .replace('Counsel', '<a href="https://gc.inc" target="_blank" rel="noopener noreferrer" class="copy-pill">Counsel</a>')
                    .replace('Neo', '<a href="https://www.neo.com" target="_blank" rel="noopener noreferrer" class="copy-pill">Neo</a>')
                    .replace('JP Morgan', '<a href="https://www.jpmorgan.com/investment-banking/technology-investment-banking" target="_blank" rel="noopener noreferrer" class="copy-pill">JP Morgan</a>')
                    .replace('calendly.com/dillon', '<a href="https://calendly.com/dillon" target="_blank" rel="noopener noreferrer" class="copy-pill">calendly.com/dillon</a>');
                container.innerHTML = withPill;
            })
            .catch(function () {
                document.getElementById('textDisplay').textContent = 'Failed to load content.';
            });

        // Respect reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (prefersReducedMotion) {
            document.documentElement.classList.add('reduce-motion');
        }
    </script>
</body>
</html>
